<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafePass • Secure Password Generator</title>
  <link rel="stylesheet" href="styles.css">
  <!-- zxcvbn password strength library -->
  <script src="https://cdn.jsdelivr.net/npm/zxcvbn@4.4.2/dist/zxcvbn.js"></script>
</head>
<body>
  <div class="container">
    <h1>SafePass</h1>
    <p>Generate cryptographically secure passwords and passphrases instantly.</p>
    
    <div class="controls">
      <div class="row">
        <label for="mode">Mode:</label>
        <select id="mode">
          <option value="chars">Random Characters</option>
          <option value="passphrase">Passphrase</option>
        </select>
      </div>
      <div class="row">
        <label for="length">Length:</label>
        <input type="number" id="length" value="16" min="8" max="128">
      </div>
      <div class="row buttons">
        <button id="generate">Generate</button>
        <button id="copy">Copy</button>
      </div>
    </div>

    <div class="output">
      <div id="pw" class="password">—</div>
      <div class="strength-bar"><i id="strengthBar"></i></div>
      <div id="strengthText">Strength: —</div>
      <div id="pwnedInfo"></div>
    </div>
  </div>

  <div id="toast">Copied!</div>

  <script src="wordlist.js"></script>
  <script src="script.js"></script>
</body>
</html>
